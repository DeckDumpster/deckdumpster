name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      instance:
        description: 'Instance name (e.g. prod, staging)'
        required: true
        default: 'prod'

env:
  INSTANCE: ${{ github.event.inputs.instance || 'prod' }}

jobs:
  # Both jobs run on the `deploy`-labelled runner, NOT `rgantt`.
  #
  # deckdumpster had one runner carrying `self-hosted,X64,Linux,rgantt`, and ci.yml's
  # `test` job targets the same labels. With 11 polecats running CI, deploys starved
  # behind them: on 2026-08-30 four merges to main had deploys queued and never run,
  # the oldest for about four hours, while the PRs showed merged and green. The queue
  # was the only place it was visible.
  #
  # `mtgc-deploy` answers only to `deploy`, so a deploy can never queue behind polecat
  # CI. It is the same physical box, so heavy CI can still make a deploy slower — but
  # it can no longer block one.
  deploy:
    runs-on: [self-hosted, deploy]
    steps:
      - name: Pull latest code
        run: git -C /opt/mtgc-${{ env.INSTANCE }} pull --ff-only origin ${{ github.ref_name }}

      - name: Prune dangling images
        run: podman image prune -f || true

      - name: Build and restart
        env:
          MTGC_ARM_SERVING_CHECK: '1'
        run: bash /opt/mtgc-${{ env.INSTANCE }}/deploy/deploy.sh ${{ env.INSTANCE }}

  # A deploy check that does not traverse the CDN is not a deploy check (de-dai).
  #
  # Deploys here have always been verified by curling localhost, which is exactly
  # what passed on 2026-08-25 while magic.dumpster.cards served day-old pages. This
  # asks the public URL the same question and compares its ETag with the
  # origin's, so "deployed" and "visible to users" stop being the same claim.
  #
  # It runs only for prod, because prod is the only instance behind the tunnel.
  # Machine credentials are not GitHub secrets: cdn-check.sh reads the Pocket ID
  # client from ~/.config/mtgc/prod/cdn-check.env on this runner (deploy/oidc-env.sh).
  # A missing or refused token is named by the script and fails the job.
  cdn-check:
    needs: deploy
    if: ${{ (github.event.inputs.instance || 'prod') == 'prod' }}
    runs-on: [self-hosted, deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Verify the deploy through Cloudflare
        env:
          XDG_RUNTIME_DIR: /run/user/1000
        run: |
          MTGC_INSTANCE=prod bash deploy/cdn-check.sh
