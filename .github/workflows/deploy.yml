name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      instance:
        description: 'Instance name (e.g. prod, staging)'
        required: true
        default: 'prod'

env:
  INSTANCE: ${{ github.event.inputs.instance || 'prod' }}

jobs:
  deploy:
    runs-on: [self-hosted, rgantt]
    steps:
      - name: Pull latest code
        run: git -C /opt/mtgc-${{ env.INSTANCE }} pull --ff-only origin ${{ github.ref_name }}

      - name: Prune dangling images
        run: podman image prune -f || true

      - name: Build and restart
        run: bash /opt/mtgc-${{ env.INSTANCE }}/deploy/deploy.sh ${{ env.INSTANCE }}

  deploy-native:
    runs-on: [self-hosted, thaen]
    steps:
      - name: Pull latest code
        run: git -C /opt/deckdumpster-code pull --ff-only origin main

      - name: Sync dependencies
        run: cd /opt/deckdumpster-code && uv sync --no-dev

      - name: Restart server
        run: launchctl kickstart -k gui/$(id -u)/com.deckdumpster.server

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sk --max-time 5 https://localhost:8080/ > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/5 — waiting..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

  # A deploy check that does not traverse the CDN is not a deploy check (de-dai).
  #
  # The job above has always ended by curling localhost, which is exactly what
  # passed on 2026-08-25 while magic.dumpster.cards served day-old pages. This
  # asks the public URL the same question and compares its ETag with the
  # origin's, so "deployed" and "visible to users" stop being the same claim.
  #
  # It runs only for prod, because prod is the only instance behind the tunnel.
  # Behind Cloudflare Access it needs a service token: set the CF_ACCESS_CLIENT_ID
  # and CF_ACCESS_CLIENT_SECRET repository secrets, or this job reports the
  # Access login page by name and fails. That failure is correct — an
  # unverifiable deploy is the condition this whole job exists to end — but it
  # is a one-time configuration, not a code problem.
  cdn-check:
    needs: deploy
    if: ${{ (github.event.inputs.instance || 'prod') == 'prod' }}
    runs-on: [self-hosted, rgantt]
    steps:
      - uses: actions/checkout@v4

      - name: Verify the deploy through Cloudflare
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          PORT=$(podman port systemd-mtgc-prod 8081/tcp | grep -oP ':\K[0-9]+' | head -1)
          [ -n "$PORT" ] || { echo "could not find prod's HTTPS port"; exit 1; }
          bash deploy/cdn-check.sh --origin "https://localhost:${PORT}"
