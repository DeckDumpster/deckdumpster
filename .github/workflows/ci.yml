name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# After merging, enable branch protection on `main` in GitHub repo settings:
#   - Require PR before merging
#   - Require the `test` status check to pass
#   - (Optional) Require up-to-date branch before merging

jobs:
  test:
    runs-on: [self-hosted, rgantt]
    steps:
      - uses: actions/checkout@v4

      # Every step of the run lives in deploy/ci.sh, so what CI does is a thing
      # you can read and run by hand, and a new gate is wired in one place
      # rather than here as well (de-xz8).
      - name: Run CI
        run: bash deploy/ci.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
