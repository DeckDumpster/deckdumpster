name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The suite runs on a Proxmox VM created for this run and destroyed after it.
# Provision and teardown are separate jobs rather than one, because a runner has
# to exist before a job can be scheduled onto it and has to be destroyed after
# that job ends -- neither of which the job itself can do.
#
# THE VM LIFECYCLE IS NOT IN THIS REPOSITORY ANY MORE. It lives in
# DeckDumpster/ephemeral-ci as two composite actions, so pokedumpster and
# anything added later get the same mechanism instead of a copy of it. What
# stays here is what runs ON the VM: deploy/runner-deps.sh and deploy/ci.sh.
# That split is deliberate -- see that repository's README for the rest of it,
# including why it is composite actions and not a reusable workflow.
#
# SECURITY NOTE, because this repository is PUBLIC. A same-repo pull request
# runs this file as edited in that PR with full access to repository secrets.
# Pull requests from FORKS do not receive secrets, so the exposure is to people
# who already have write access -- not to the public. Even so, treat every
# secret here as readable by any collaborator:
#
#   PVE_TOKEN_SECRET  bounded by the pveum ACL to cloning and destroying VMs
#                     inside /pool/ephemeral-ci. Do not widen that ACL.
#   TS_OAUTH_SECRET   bounded by the Tailscale ACL for tag:ci, which should
#                     permit only the hypervisor on 8006.
#   RUNNER_REG_PAT    organization "Self-hosted runners: Read and write" and
#                     nothing else. It cannot delete a repository, add
#                     collaborators or alter branch protection.

permissions:
  contents: read

# One CI run at a time, repo-wide. Every run provisions a VM from Proxmox template
# 9110; concurrent runs starve each other on the hypervisor (measured 2026-09-22,
# four runs starved; again 2026-09-23 with three simultaneous provisions).
# cancel-in-progress: false is deliberate -- cancelling mid-provision skips teardown
# and strands the VM. VMID recycling then makes a later teardown destroy someone
# else's machine (killed two live runners on 2026-09-23). Queue, never cancel.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    # VM provisioning measured under 5 min; 15 min leaves room for a slow day.
    timeout-minutes: 15
    outputs:
      vmid: ${{ steps.vm.outputs.vmid }}
      label: ${{ steps.vm.outputs.label }}
      # Guard 4b's ownership token. teardown REFUSES a VM that carries a token
      # when the caller presents none, so this output is not optional once the
      # pinned provision stamps one.
      vm-token: ${{ steps.vm.outputs.vm-token }}
    steps:
      - uses: DeckDumpster/ephemeral-ci/provision@v1
        id: vm
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # The real suite, on the VM provisioned above.
  #
  # NAMED `gate` BECAUSE THAT NAME IS A CONTRACT. Spira's forge.sh check-status
  # looks for a check named exactly `gate` to decide whether a batch PR is green.
  # A missing gate check reads as pending forever, so a batch PR would sit until
  # SPIRA_QUEUE_CI_MAXSEC (7200s) and then fault. pokedumpster's ci.yml already
  # uses this name. It is also why the lifecycle above is a composite action and
  # not a reusable workflow, which would report this check as `gate / <inner-job>`.
  #
  # It installs its own system dependencies first. deploy/ci.sh calls podman and
  # uv and installs neither; that went unnoticed for as long as CI only ever ran
  # on one box where somebody had installed them by hand. The list lives in
  # deploy/runner-deps.sh, ci.sh refuses to start until it is satisfied, and
  # this is where a fresh machine satisfies it.
  #
  # Installing here rather than baking it into the Proxmox template is
  # deliberate: baked, the dependency goes back to being invisible and every
  # change to it needs a manual hypervisor pass. Declared here it is reviewed in
  # a pull request like anything else. Bake it later as a cache if the install
  # time justifies it -- the script is idempotent, so a template that already
  # has everything makes this step a few `command -v` calls.
  gate:
    needs: provision
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    # Recent full runs measured 45-49 min (2026-09-25, run 36185545409 and
    # neighbours). 90 min is ~2x the longest observed run, which is the
    # headroom needed to not kill a legitimately slow full suite while still
    # bounding a hung job well inside GitHub's 6-hour default. A PR touching
    # only workflow files runs lint+unit, which completes in under 10 min --
    # the cap does not threaten those either. (db-ise2)
    timeout-minutes: 90
    # statuses:write for the final step, which posts this run's result as a COMMIT
    # STATUS. The repo default is read-only (default_workflow_permissions=read), so
    # without this the POST 403s and the belt-and-braces below silently does
    # nothing — the exact failure mode it exists to prevent.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the job landed on the ephemeral VM
        run: test "$RUNNER_NAME" = "${{ needs.provision.outputs.label }}"

      # UNATTENDED-UPGRADES HAS NOTHING TO OFFER A VM THAT LIVES AN HOUR, and it
      # can take the whole run with it: it holds the dpkg lock at exactly the
      # moment runner-deps wants it, and with Automatic-Reboot it can restart the
      # guest mid-suite. A restart presents as `The runner has received a shutdown
      # signal` and NOTHING ELSE -- the service logs to the guest journal, not to
      # this log, so the job output carries no apt message to find. Three runs died
      # that way on 2026-09-22 (#376 #378 #379 #380) and the first pass at
      # diagnosing them grepped this log for apt errors, found none, and wrongly
      # ruled it out.
      #
      # The template masks the service (DeckDumpster/ephemeral-ci
      # scripts/template-substrate.sh) and pokedumpster, which clones the same
      # template 9110, has never seen a shutdown signal. So this is belt to that
      # template's braces: it costs a second, it is idempotent, and it means a
      # template rebuilt without the mask cannot silently reintroduce the fault.
      #
      # THE REPORT IS THE POINT AS MUCH AS THE MASK. Whatever the state was, it is
      # printed before it is changed, so the next person reading a dead run can see
      # from this log alone whether the service was live -- which is the evidence
      # that was missing the first time.
      - name: Defuse unattended-upgrades on the ephemeral VM
        run: |
          echo "== before =="
          systemctl is-enabled unattended-upgrades.service 2>&1 || true
          systemctl is-active  unattended-upgrades.service 2>&1 || true
          for t in apt-daily.timer apt-daily-upgrade.timer; do
            printf '%s: %s / %s\n' "$t" \
              "$(systemctl is-enabled "$t" 2>&1)" "$(systemctl is-active "$t" 2>&1)"
          done
          test -f /var/run/reboot-required && echo "REBOOT PENDING AT JOB START" || true

          sudo -n systemctl stop    unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer 2>&1 || true
          sudo -n systemctl mask    unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer 2>&1 || true

          echo "== after =="
          systemctl is-enabled unattended-upgrades.service 2>&1 || true

      - name: Install runner dependencies
        run: bash deploy/runner-deps.sh

      # Compute which CI tiers this run needs (db-5sku).
      #
      # For a push to main or a workflow_dispatch the answer is always every
      # tier: main's baseline must stay unconditional, and a dispatch is an
      # explicit request to run the full suite. For a pull request we ask
      # deploy/compute-tiers.sh: if every changed file is a known-cheap path
      # (workflow files, this test) the answer is lint+unit; anything
      # unrecognised produces the full set.
      #
      # THE WORKFLOW ALWAYS RUNS AND ALWAYS POSTS ITS STATUS. Tier selection
      # only changes what deploy/ci.sh does, not whether this job runs --
      # using paths-ignore: to skip the workflow entirely would break the
      # required `test` status check (de-323, db-5sku).
      - name: Compute CI tiers
        id: tiers
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "tiers=lint,unit,integration,ui" >> "$GITHUB_OUTPUT"
            echo "==> Non-PR event (${{ github.event_name }}): full suite"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD HEAD)
          tiers=$(echo "$changed" | bash deploy/compute-tiers.sh)
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"
          echo "==> Pull request: tiers=${tiers}"
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

      - name: Run CI
        run: bash deploy/ci.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DECKDUMP_CI_TIERS: ${{ steps.tiers.outputs.tiers }}

      # BELT AND BRACES: report this run as a commit status, whatever triggered it.
      #
      # GitHub creates one check suite per (commit, app). A `workflow_dispatch` run
      # creates that suite, so opening a PR on the same SHA afterwards produces no
      # new run and the PR shows NO CHECKS — the required `test` context reads as
      # missing rather than green, even though the commit WAS tested. On 2026-08-13
      # pokedumpster hit exactly this with five of six open PRs in that state.
      #
      # A commit status has no such coupling: it attaches to the SHA and shows in the
      # merge box whatever triggered the run.
      #
      # `if: always()` because a FAILING run must post `failure`. A step that ran
      # only on success would leave a red run looking untested — worse than no
      # status at all.
      #
      # The SHA must be the PR HEAD, not github.sha: on a pull_request event
      # github.sha is the ephemeral merge commit, and a status there is invisible to
      # the merge box.
      - name: Report result as commit status (test)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # curl, not `gh`. The GitHub CLI is not installed on the ephemeral VM and
        # is not worth installing for one POST: this step died with
        # `gh: command not found` (exit 127) on the first cold pokedumpster run,
        # AFTER the suite had already produced its verdict. curl is already a
        # required dependency.
        #
        # --fail-with-body so an HTTP error is an error here and not a silent
        # 200-shaped success; without it a 403 from a read-only token would
        # print a JSON error and exit 0, which is precisely the failure mode
        # this whole step exists to prevent.
        #
        # THE STATUS DESCRIPTION MUST NOT NAME deploy/ci.sh, which is why it
        # reads "CI suite" here and "deploy/ci.sh" in pokedumpster's copy of
        # this step. tests/test_ci_entrypoint.py asserts the `test` job runs
        # exactly one gate, and its GATE regex matches `deploy/ci\.sh` anywhere
        # in a step's `run:` text -- including inside a quoted JSON payload. The
        # first version of this step named the script in its description and was
        # counted as a second gate, failing that test on a step that runs no
        # gate at all. pokedumpster has no equivalent guard, so the string is
        # harmless there and is not harmless here.
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/statuses/${SHA}" \
            -d "$(printf '{"state":"%s","context":"test","target_url":"%s","description":"CI suite (%s)"}' \
                  "$STATE" "$RUN_URL" "${{ github.event_name }}")" >/dev/null
          echo "posted commit status ${STATE} for ${SHA} (context: test)"

  # if: always() is load-bearing. A cancelled or failed run otherwise leaves the
  # VM running, and the hourly reaper becomes the only thing that cleans up --
  # which is a backstop, not a plan. No `vmid != ''` guard here: the teardown
  # action skips the destroy itself when there is no VMID, and it still has the
  # runner registration to remove, which a provision that registered but never
  # got a job scheduled would otherwise leak.
  teardown:
    needs: [provision, gate]
    if: always()
    runs-on: ubuntu-latest
    # VM teardown measured under 5 min; 15 min leaves room for a slow day.
    timeout-minutes: 15
    steps:
      - uses: DeckDumpster/ephemeral-ci/teardown@v1
        with:
          vmid:  ${{ needs.provision.outputs.vmid }}
          label: ${{ needs.provision.outputs.label }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}
          vm-token:           ${{ needs.provision.outputs.vm-token }}
