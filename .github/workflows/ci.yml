name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The suite runs on a Proxmox VM created for this run and destroyed after it.
# Provision and teardown are separate jobs rather than one, because a runner has
# to exist before a job can be scheduled onto it and has to be destroyed after
# that job ends -- neither of which the job itself can do.
#
# THE VM LIFECYCLE IS NOT IN THIS REPOSITORY ANY MORE. It lives in
# DeckDumpster/ephemeral-ci as two composite actions, so pokedumpster and
# anything added later get the same mechanism instead of a copy of it. What
# stays here is what runs ON the VM: deploy/runner-deps.sh and deploy/ci.sh.
# That split is deliberate -- see that repository's README for the rest of it,
# including why it is composite actions and not a reusable workflow.
#
# SECURITY NOTE, because this repository is PUBLIC. A same-repo pull request
# runs this file as edited in that PR with full access to repository secrets.
# Pull requests from FORKS do not receive secrets, so the exposure is to people
# who already have write access -- not to the public. Even so, treat every
# secret here as readable by any collaborator:
#
#   PVE_TOKEN_SECRET  bounded by the pveum ACL to cloning and destroying VMs
#                     inside /pool/ephemeral-ci. Do not widen that ACL.
#   TS_OAUTH_SECRET   bounded by the Tailscale ACL for tag:ci, which should
#                     permit only the hypervisor on 8006.
#   RUNNER_REG_PAT    organization "Self-hosted runners: Read and write" and
#                     nothing else. It cannot delete a repository, add
#                     collaborators or alter branch protection.

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      vmid: ${{ steps.vm.outputs.vmid }}
      label: ${{ steps.vm.outputs.label }}
    steps:
      - uses: DeckDumpster/ephemeral-ci/provision@v1
        id: vm
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # The real suite, on the VM provisioned above.
  #
  # NAMED `test` BECAUSE THAT NAME IS A CONTRACT. The `pr-required` ruleset on
  # main requires a status check called `test`. A required check that never
  # reports does not fail the pull request -- it blocks the merge indefinitely
  # with "the base branch policy prohibits the merge", and nothing in the run
  # itself looks wrong: every job is green. Renaming this job is therefore a
  # change to the branch policy, and has to be made in both places or neither
  # (de-323). It is also why the lifecycle above is a composite action and not a
  # reusable workflow, which would report this check as `test / <inner-job>`.
  #
  # It installs its own system dependencies first. deploy/ci.sh calls podman and
  # uv and installs neither; that went unnoticed for as long as CI only ever ran
  # on one box where somebody had installed them by hand. The list lives in
  # deploy/runner-deps.sh, ci.sh refuses to start until it is satisfied, and
  # this is where a fresh machine satisfies it.
  #
  # Installing here rather than baking it into the Proxmox template is
  # deliberate: baked, the dependency goes back to being invisible and every
  # change to it needs a manual hypervisor pass. Declared here it is reviewed in
  # a pull request like anything else. Bake it later as a cache if the install
  # time justifies it -- the script is idempotent, so a template that already
  # has everything makes this step a few `command -v` calls.
  test:
    needs: provision
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the job landed on the ephemeral VM
        run: test "$RUNNER_NAME" = "${{ needs.provision.outputs.label }}"

      - name: Install runner dependencies
        run: bash deploy/runner-deps.sh

      - name: Run CI
        run: bash deploy/ci.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # if: always() is load-bearing. A cancelled or failed run otherwise leaves the
  # VM running, and the hourly reaper becomes the only thing that cleans up --
  # which is a backstop, not a plan. No `vmid != ''` guard here: the teardown
  # action skips the destroy itself when there is no VMID, and it still has the
  # runner registration to remove, which a provision that registered but never
  # got a job scheduled would otherwise leak.
  teardown:
    needs: [provision, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: DeckDumpster/ephemeral-ci/teardown@v1
        with:
          vmid:  ${{ needs.provision.outputs.vmid }}
          label: ${{ needs.provision.outputs.label }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}
