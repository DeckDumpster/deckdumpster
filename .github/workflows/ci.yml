name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# After merging, enable branch protection on `main` in GitHub repo settings:
#   - Require PR before merging
#   - Require the `test` status check to pass
#   - (Optional) Require up-to-date branch before merging

jobs:
  test:
    runs-on: [self-hosted, rgantt]
    env:
      INSTANCE: ci-test
      XDG_RUNTIME_DIR: /run/user/1000
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4

      # Nothing this job builds belongs on the disk prod runs from (de-3mo).
      # Which disk that is on the runner box is host config, not a repo
      # constant, so it comes from ~/.config/mtgc/store.env; unconfigured, this
      # is a no-op and everything uses Podman's default store exactly as before.
      #
      # Exported through GITHUB_PATH/GITHUB_ENV rather than activated per step:
      # the mechanism is a `podman` shim on PATH, and GitHub Actions runs each
      # step in a fresh shell. This is how the later steps inherit it — including
      # `uv run pytest`, whose conftests shell out to `podman port` and
      # `podman exec` and would otherwise look in the default store.
      - name: Select container store
        run: |
          . deploy/store-lib.sh
          mtgc_store_load_config
          mtgc_store_activate
          if [ -n "${MTGC_STORE_ROOT:-}" ]; then
            echo "${MTGC_STORE_ROOT}/bin" >> "$GITHUB_PATH"
            {
              echo "MTGC_STORE_ROOT=${MTGC_STORE_ROOT}"
              echo "MTGC_STORE_GLOBAL_ARGS=${MTGC_STORE_GLOBAL_ARGS}"
              echo "TMPDIR=${TMPDIR}"
            } >> "$GITHUB_ENV"
          fi

      - name: Clean up stale containers and images
        run: |
          bash deploy/teardown.sh $INSTANCE --purge 2>/dev/null || true
          podman image prune -f 2>/dev/null || true

      # Before this job builds anything: refuse to start on a nearly-full disk
      # (de-3ww). / has hit 100% on the deployment box twice, and a build that
      # runs out of room does not fail as a disk error — one produced
      # `ld terminated with signal 7 [Bus error]`, which reads as a toolchain
      # bug. Both disks are checked: $HOME holds the uv cache the Containerfile
      # bind-mounts and the default store, MTGC_STORE_ROOT (set by the
      # Select container store step, if this box names one) is where they land. This is the
      # first step that can fail on space, so it goes ahead of the isolation
      # gate rather than after it — the gate builds an image too.
      - name: Disk floor check
        run: bash deploy/diskcheck.sh --floor "$HOME" "${MTGC_STORE_ROOT:-$HOME}"

      # Before the job writes several more gigabytes of its own: a --test
      # bring-up must put nothing under $HOME, which on the deployment box is
      # the disk prod runs from (de-3a0). de-3mo gave those bytes somewhere
      # else to live, but nothing checked that it holds, and a rule nobody
      # tests is not enforced — / has hit 100% from non-prod container bytes
      # twice. Costs one image build; see deploy/store-isolation-gate.sh for
      # what it asserts and why the tolerance is not zero.
      - name: Container-store isolation gate
        run: bash deploy/store-isolation-gate.sh

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run shot-scraper install

      - name: Build and start test container
        run: bash deploy/setup.sh $INSTANCE --test

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            PORT=$(podman port systemd-mtgc-$INSTANCE 8081/tcp | cut -d: -f2)
            curl -skf https://localhost:$PORT/ && exit 0
            sleep 3
          done
          echo "Server failed to start" && exit 1

      - name: Run unit tests
        run: uv run pytest tests/ -q --ignore=tests/integration --ignore=tests/ui

      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --instance $INSTANCE

      - name: Run UI scenario tests
        run: uv run pytest tests/ui/ -q --instance $INSTANCE
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Teardown test container
        if: always()
        run: bash deploy/teardown.sh $INSTANCE --purge || true
