# Scenario: Completion meters read as fractions, and vanish rather than read NaN
#
# Related:
#   issues: [de-k5o, de-1ov]
#   pull_requests: []
#
# Prerequisites:
#   tests/fixtures/test-data.sqlite stores base_set_size for 17 of its 18
#   cached sets and leaves spg NULL (MTGJSON reports baseSetSize 0 for Special
#   Guests), so one /sets render reaches both the drawn and the hidden base
#   meter. Before de-1ov every set was NULL and only the hidden case existed.

description: >
  Each set on /sets carries completion meters reading how much of it I own
  as plain "owned / total" fractions with bars behind them: how much of the
  base set, and how much of every printing in it. The base fraction is
  measured against the base set, so it is a different number from the
  all-printings one. Where the app does not know where a set's base set ends
  — which is a permanent, ordinary state for a set no data source reports a
  size for — that meter is simply not drawn, rather than rendering an empty
  0 / 0 bar or a NaN percentage. Every set still shows its all-printings
  meter, so no set is left with no completion information at all.
