# Scenario: Completion meters read as fractions, and vanish rather than read NaN
#
# Related:
#   issues: [de-k5o, de-1ov]
#   pull_requests: []
#
# Prerequisites:
#   Every set in tests/fixtures/test-data.sqlite has base_set_size NULL, so
#   this fixture reaches only the hidden-base-meter case. de-1ov tracks giving
#   the fixture real set sizes; when it lands, this scenario should grow an
#   assertion that a set WITH a stored base size shows both meters.

description: >
  Each set on /sets carries a completion meter reading how much of it I own
  as a plain "owned / total" fraction with a bar behind it. Where the app
  does not know where a set's base set ends — which is a permanent, ordinary
  state for a set no data source reports a size for — the base meter is
  simply not drawn, rather than rendering an empty 0 / 0 bar or a NaN
  percentage. Every set still shows its all-printings meter, so no set is
  left with no completion information at all.
