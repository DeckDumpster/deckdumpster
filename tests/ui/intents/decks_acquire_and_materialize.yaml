# Scenario: Add to Collection then Materialize a Jumpstart deck
#
# Related:
#   issues: [db-rg5n]

description: >
  I open the New Deck picker, create a Foundations Jumpstart "Angels (1)" deck,
  and land on the deck page. The "Add to Collection" button is visible because
  the deck has an expected card list. I click it, confirm the dialog, and receive
  a summary alert. After the page reloads, I click Materialize. The completeness
  panel then shows all expected cards present and zero missing.
