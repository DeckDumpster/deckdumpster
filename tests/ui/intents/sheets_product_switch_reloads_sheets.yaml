# Scenario: Switching product type reloads sheets and updates URL hash
#
# Related:
#   pages: [sheets]

description: >
  With a set loaded, clicking a different product pill reloads the sheet
  content with that product's sheet names, updates the sheet count, and
  rewrites the URL hash to name the product I picked. Clicking back to the
  first product returns its sheets, so the pills switch the view both ways.
