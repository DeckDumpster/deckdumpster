  - '"New Deck" button in header controls'
  - "#deck-modal.active with h3#modal-title showing 'New Deck'"
  - "three .mode-tab buttons: Blank (active by default), Preconstructed, Jumpstart"
  - "Blank mode: #f-name, #f-format, #f-description"
  - "Shared fields under every mode: #f-deck-state, #f-sleeve, #f-deckbox, #f-location"
