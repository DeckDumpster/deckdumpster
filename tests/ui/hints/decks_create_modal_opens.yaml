fixture_data: {}
notes: >
  Navigate to /decks. Click "New Deck" — modal opens with three tabs at the top.
  Blank is active by default and shows the Name, Format, Description fields plus
  the shared State/Sleeve/Deckbox/Location row. The primary button reads "Create"
  and a Cancel button is visible. Click the Preconstructed tab — the blank-mode
  section hides, the precon Set + Deck dropdowns appear, and the save button text
  flips to "Import". Take a screenshot.
