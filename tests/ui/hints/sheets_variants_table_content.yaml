start_page: "/sheets#set=blb&product=play"
involves:
  - "variants section .section.open (expanded by default, first section)"
  - "variants table .variants-table with th and td elements"
  - "variant pills .variant-pill (sheet name labels)"
  - "status text #status"
fixture_data:
  set: "blb"
  product: "play"
  variant_count: 4
notes: >
  Load BLB play via the deep link so the sheet render happens under the
  page-load budget; do not navigate again inside the scenario, which pays
  the whole 535 KB fetch and ~1000-card render a second time.
  Wait on "8 sheets" first (5 s, page load): the deep link renders the
  auto-selected first product (collector, 6 sheets) before switching to
  play, and both renders paint .variants-table and .variant-pill, so any
  assertion made before that wait can pass against collector's render.
  #status is written after the section loop, so the count is what tells
  the two apart. Then verify .variants-table is visible, .variant-pill
  elements exist, and % values are shown. The table has columns:
  #, Probability, Contents.
