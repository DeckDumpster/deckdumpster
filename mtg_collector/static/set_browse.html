<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Set</title>
<link rel="stylesheet" href="/static/vendor/keyrune/keyrune.min.css">
<link rel="stylesheet" href="/static/shared-card-tile.css">
<link rel="stylesheet" href="/static/shared-card-modal.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}

header {
  background: #16213e;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 2px solid #0f3460;
}

header h1 {
  font-size: 1.3rem;
  color: #e94560;
  white-space: nowrap;
}

header h1 .set-code {
  color: #888;
  font-size: 0.9rem;
  font-weight: 400;
  margin-left: 6px;
}

/* --- Completion meters ------------------------------------------------ */

/* Two, both counting printings, both computed before q/filter — with base
   completion alone the header would read 309/311 while 599 tiles are on
   screen, and the extended printings would be counted by nothing. */
.meters {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.meter {
  min-width: 150px;
}

.meter-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.75rem;
  color: #888;
  margin-bottom: 3px;
}

.meter-label .count {
  color: #e0e0e0;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.meter-bar {
  height: 6px;
  border-radius: 3px;
  background: #0f3460;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  background: #e94560;
  width: 0;
}

/* A set no source reports a base size for gets no bar at all, rather than
   0/0 rendered as NaN%. */
.meter.hidden { display: none; }

/* --- Controls --------------------------------------------------------- */

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

select, button, input[type="search"] {
  padding: 8px 14px;
  border: 1px solid #0f3460;
  border-radius: 6px;
  background: #1a1a2e;
  color: #e0e0e0;
  font-size: 0.9rem;
  cursor: pointer;
}

select:focus, button:focus, input[type="search"]:focus { outline: 2px solid #e94560; }

input[type="search"] {
  width: 200px;
  cursor: text;
}

button.toggle {
  background: #1a1a2e;
  border-color: #0f3460;
  color: #888;
  font-weight: 600;
}
button.toggle:hover { border-color: #e94560; color: #e0e0e0; }
button.toggle.on {
  background: #e94560;
  border-color: #e94560;
  color: #fff;
}

.pill-group {
  display: flex;
  gap: 6px;
  align-items: center;
}

.col-controls {
  display: flex;
  align-items: center;
  gap: 0;
}
.col-btn {
  width: 28px; height: 28px;
  border: 1px solid #0f3460;
  background: #16213e;
  color: #888;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  padding: 0;
}
.col-btn:first-child { border-radius: 6px 0 0 6px; }
.col-btn:last-child { border-radius: 0 6px 6px 0; }
.col-btn + .col-btn { border-left: none; }
.col-btn:hover { border-color: #e94560; color: #e0e0e0; }
.col-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.col-count {
  width: 28px; height: 28px;
  border: 1px solid #0f3460; border-left: none; border-right: none;
  background: #16213e;
  color: #e0e0e0;
  font-size: 0.8rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}

/* Appears with the first add that lands, not on page load — before that there
   is no batch to review. */
#batch-link {
  font-size: 0.8rem;
  color: #e94560;
  text-decoration: none;
  border: 1px solid #0f3460;
  border-radius: 6px;
  padding: 6px 12px;
  white-space: nowrap;
  margin-left: auto;
}
#batch-link:hover { border-color: #e94560; }
#batch-link[hidden] { display: none; }

#status {
  font-size: 0.85rem;
  color: #888;
  margin-left: auto;
}

/* Two things claim the right-hand end of the header; only the first of them
   should push. */
#batch-link:not([hidden]) + #status { margin-left: 0; }

#status.error { color: #e94560; }

/* --- Content ---------------------------------------------------------- */

.content { padding: 12px; }

.section { margin-bottom: 16px; }

.section-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 4px;
  border-bottom: 1px solid #0f3460;
  margin-bottom: 10px;
}

.section-header h2 {
  font-size: 1rem;
  color: #e0e0e0;
}

.section-header .meta {
  font-size: 0.8rem;
  color: #888;
  font-variant-numeric: tabular-nums;
}

.empty-state {
  color: #555;
  font-style: italic;
  font-size: 0.9rem;
  padding: 32px;
  text-align: center;
}

/* --- Modal binder controls -------------------------------------------- */

/* Rendered into the shared card modal through its renderExtra hook — this page
   is that hook's first user, deck_builder.html (the other caller) passes none
   and so is untouched by everything below. */

.binder-controls { border-top: 1px solid #0f3460; }

.binder-controls select {
  width: 100%;
  margin-bottom: 4px;
}

.binder-finish {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.85rem;
}
.binder-finish .label { color: #888; }

.binder-stepper { display: flex; align-items: center; }

.binder-step {
  width: 28px; height: 28px;
  border: 1px solid #0f3460;
  background: #1a1a2e;
  color: #888;
  font-size: 1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  padding: 0;
}
.binder-step:first-child { border-radius: 6px 0 0 6px; }
.binder-step:last-child { border-radius: 0 6px 6px 0; }
.binder-step:hover { border-color: #e94560; color: #e0e0e0; }
.binder-step:disabled { opacity: 0.3; cursor: not-allowed; }

.binder-count {
  min-width: 30px; height: 28px;
  border: 1px solid #0f3460; border-left: none; border-right: none;
  background: #16213e;
  color: #e0e0e0;
  font-size: 0.8rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}

/* A step the server rejected, said in the modal it was clicked in — the tile
   behind it may well be off screen. */
.binder-error {
  font-size: 0.7rem;
  font-weight: 700;
  color: #e94560;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.binder-error:empty { display: none; }

/* A pip add that the server rejected: the local increment is rolled back and
   the failure is said on the tile it happened on, not page-wide. */
.pip-error {
  font-size: 0.6rem;
  font-weight: 700;
  color: #e94560;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-top: 2px;
}
</style>
</head>
<body>

<header>
  <h1><span id="set-name">Loading…</span><span class="set-code" id="set-code"></span></h1>

  <div class="meters">
    <div class="meter hidden" id="meter-base">
      <div class="meter-label"><span>Set</span><span class="count" id="meter-base-count"></span></div>
      <div class="meter-bar"><div class="meter-fill" id="meter-base-fill"></div></div>
    </div>
    <div class="meter hidden" id="meter-all">
      <div class="meter-label"><span>All printings</span><span class="count" id="meter-all-count"></span></div>
      <div class="meter-bar"><div class="meter-fill" id="meter-all-fill"></div></div>
    </div>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search this set…" autocomplete="off">

    <select id="filter">
      <option value="all">All pockets</option>
      <option value="have">Have</option>
      <option value="need">Need</option>
    </select>

    <select id="sort">
      <option value="number">Number</option>
      <option value="name">Name</option>
      <option value="rarity">Rarity</option>
      <option value="price">Price</option>
      <option value="qty">Copies</option>
    </select>
    <button type="button" class="toggle" id="order" title="Sort direction">Asc</button>

    <div class="pill-group" id="sections">
      <button type="button" class="toggle" data-section="base">Base</button>
      <button type="button" class="toggle" data-section="extended">Extended</button>
      <button type="button" class="toggle" data-section="promo">Promos</button>
    </div>

    <div class="col-controls">
      <button type="button" class="col-btn" id="col-minus">&minus;</button>
      <span class="col-count" id="col-count">6</span>
      <button type="button" class="col-btn" id="col-plus">+</button>
    </div>
  </div>

  <a id="batch-link" href="/batches" hidden>Review this pass →</a>

  <div id="status"></div>
</header>

<div class="content" id="content">
  <div class="empty-state">Loading…</div>
</div>

<script src="/static/shared.js"></script>
<script src="/static/shared-card-table.js"></script>
<script src="/static/shared-card-tile.js"></script>
<script src="/static/shared-card-modal.js"></script>
<script>
/* /sets/:set_code — one set laid out as a binder page.

   The whole set arrives in one request: a set is bounded (779 printings is the
   largest real one) where a collection is not, so this asks for limit=1000 and
   renders the lot, instead of /collection's virtual scroller.

   URL IS THE STATE. Every control writes back to the query string with its
   default elided, so a view is a link and a reload restores it. */

const SET_CODE = decodeURIComponent(location.pathname.split('/')[2] || '').toLowerCase();

const PAGE_LIMIT = 1000;
const COL_MIN = 1, COL_MAX = 12;

/* Defaults, elided from the URL. `sections` is a set rather than a string so
   toggling one is not string surgery; it serialises back in SECTION_ORDER. */
const DEFAULTS = {cols: 6, sort: 'number', order: 'asc', q: '', filter: 'all',
                  sections: 'base,extended'};

const SECTION_ORDER = ['base', 'extended', 'promo'];
const SECTION_TITLES = {base: 'Base set', extended: 'Extended', promo: 'Promos'};

const SORT_KEYS = ['number', 'name', 'rarity', 'price', 'qty'];
const FILTERS = ['all', 'have', 'need'];

const statusEl = document.getElementById('status');
const content = document.getElementById('content');
const qInput = document.getElementById('q');
const filterSel = document.getElementById('filter');
const sortSel = document.getElementById('sort');
const orderBtn = document.getElementById('order');
const sectionsEl = document.getElementById('sections');

let _settings = {};
let _rows = [];
let _setName = '';
/* The two header meters. Held on the page rather than re-read from each
   response so a pip add can move them without a refetch. */
let _completion = {};

/* The condition every add of this page visit is filed under. It is chosen in
   the card modal and STICKS: the next pip click anywhere in the grid uses it
   too, for the rest of the visit. A binder is usually uniform — the whole
   thing is Lightly Played, or the whole thing is Near Mint — so re-picking it
   per card is the tax that makes a reconciliation pass not worth doing.
   Page-scope on purpose: a reload is a new pass and starts at Near Mint. */
const CONDITIONS = ['Near Mint', 'Lightly Played', 'Moderately Played',
                    'Heavily Played', 'Damaged'];
let _condition = CONDITIONS[0];

/* Full words here, where there is room for them; the pips under the art use
   the abbreviations in shared-card-tile.js because a tile has none. */
const FINISH_NAMES = {nonfoil: 'Nonfoil', foil: 'Foil', etched: 'Etched'};

const modal = createCardModal();

/* The row the modal last opened on, so a stepper click knows what it is
   stepping. It is not cleared on close — the shared modal has three ways to
   close and announces none of them — so anything reading it also checks that
   the overlay is still active. */
let _modalCard = null;

// --- View state -------------------------------------------------------

/* cards-per-row is the one control that is also remembered across sets, the
   same way its four siblings are (collectionGridCols, crackPackGridCols,
   exploreGridCols, recentGridCols). The URL wins when it says something. */
function storedCols() {
  const n = parseInt(localStorage.getItem('setsGridCols'), 10);
  return Number.isInteger(n) && n >= COL_MIN && n <= COL_MAX ? n : DEFAULTS.cols;
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  const cols = parseInt(p.get('cols'), 10);
  const sections = (p.get('sections') || DEFAULTS.sections)
    .split(',').filter(s => SECTION_ORDER.includes(s));
  return {
    cols: Number.isInteger(cols) && cols >= COL_MIN && cols <= COL_MAX ? cols : storedCols(),
    sort: SORT_KEYS.includes(p.get('sort')) ? p.get('sort') : DEFAULTS.sort,
    order: p.get('order') === 'desc' ? 'desc' : DEFAULTS.order,
    q: p.get('q') || DEFAULTS.q,
    filter: FILTERS.includes(p.get('filter')) ? p.get('filter') : DEFAULTS.filter,
    sections: sections.length ? sections : DEFAULTS.sections.split(','),
  };
}

let view = readUrl();

function writeUrl() {
  const p = new URLSearchParams();
  const sections = SECTION_ORDER.filter(s => view.sections.includes(s)).join(',');
  const current = {...view, sections};
  for (const key of ['cols', 'sort', 'order', 'q', 'filter', 'sections']) {
    if (String(current[key]) !== String(DEFAULTS[key])) p.set(key, current[key]);
  }
  const qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

// --- Cards per row ----------------------------------------------------

function applyGridCols() {
  document.documentElement.style.setProperty('--grid-cols', view.cols);
  document.getElementById('col-count').textContent = view.cols;
  document.getElementById('col-minus').disabled = view.cols <= COL_MIN;
  document.getElementById('col-plus').disabled = view.cols >= COL_MAX;
  localStorage.setItem('setsGridCols', view.cols);
}

document.getElementById('col-minus').addEventListener('click', () => {
  if (view.cols > COL_MIN) { view.cols--; applyGridCols(); writeUrl(); }
});
document.getElementById('col-plus').addEventListener('click', () => {
  if (view.cols < COL_MAX) { view.cols++; applyGridCols(); writeUrl(); }
});

// --- Controls ---------------------------------------------------------

function syncControls() {
  qInput.value = view.q;
  filterSel.value = view.filter;
  sortSel.value = view.sort;
  orderBtn.textContent = view.order === 'desc' ? 'Desc' : 'Asc';
  orderBtn.classList.toggle('on', view.order === 'desc');
  for (const btn of sectionsEl.querySelectorAll('button')) {
    btn.classList.toggle('on', view.sections.includes(btn.dataset.section));
  }
  applyGridCols();
}

let _qTimer = null;
qInput.addEventListener('input', () => {
  clearTimeout(_qTimer);
  _qTimer = setTimeout(() => { view.q = qInput.value.trim(); writeUrl(); load(); }, 250);
});

filterSel.addEventListener('change', () => { view.filter = filterSel.value; writeUrl(); load(); });
sortSel.addEventListener('change', () => { view.sort = sortSel.value; writeUrl(); load(); });

orderBtn.addEventListener('click', () => {
  view.order = view.order === 'desc' ? 'asc' : 'desc';
  syncControls();
  writeUrl();
  load();
});

sectionsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-section]');
  if (!btn) return;
  const section = btn.dataset.section;
  const next = view.sections.includes(section)
    ? view.sections.filter(s => s !== section)
    : view.sections.concat([section]);
  // The endpoint rejects an empty `sections`, and a binder with no sections is
  // not a view anyone asked for — the last one on stays on.
  if (!next.length) return;
  view.sections = next;
  syncControls();
  writeUrl();
  load();
});

// --- Loading ----------------------------------------------------------

async function load() {
  statusEl.classList.remove('error');
  statusEl.textContent = 'Loading…';

  const p = new URLSearchParams({
    limit: PAGE_LIMIT,
    sort: view.sort,
    order: view.order,
    filter: view.filter,
    sections: SECTION_ORDER.filter(s => view.sections.includes(s)).join(','),
  });
  if (view.q) p.set('q', view.q);

  const res = await fetch(`/api/set-browse/${encodeURIComponent(SET_CODE)}?${p}`);
  const body = await res.json();
  if (!res.ok) {
    statusEl.classList.add('error');
    statusEl.textContent = body.error || `HTTP ${res.status}`;
    content.innerHTML = `<div class="empty-state">${esc(body.error || 'Could not load this set.')}</div>`;
    return;
  }

  _rows = body.rows;
  if (body.set) {
    _setName = body.set.set_name || SET_CODE.toUpperCase();
    document.title = `${_setName} — Browse Set`;
    document.getElementById('set-name').textContent = _setName;
    document.getElementById('set-code').textContent = SET_CODE.toUpperCase();
    _completion = {
      owned_base: body.owned_base, total_base: body.total_base,
      owned_all: body.owned_all, total_all: body.total_all,
    };
    renderMeters();
  }

  render();
  // The whole set fits in one page today -- the largest real one is 779
  // printings against a 1000 cap -- so this line normally just counts them.
  // If a set ever outgrows the cap, say so rather than render a short grid
  // under a full count, which reads as a set with cards missing.
  const shown = _rows.length < body.total ? `, showing ${_rows.length}` : '';
  statusEl.textContent =
    `${body.total} printing${body.total === 1 ? '' : 's'}${shown}`;
}

function renderMeters() {
  setMeter('base', _completion.owned_base, _completion.total_base);
  setMeter('all', _completion.owned_all, _completion.total_all);
}

/* A null pair is a set no source reports a base size for. Hide the bar rather
   than render 0/0 as NaN%. */
function setMeter(name, owned, total) {
  const el = document.getElementById(`meter-${name}`);
  if (owned == null || total == null) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  document.getElementById(`meter-${name}-count`).textContent = `${owned} / ${total}`;
  const pct = total > 0 ? (owned / total) * 100 : 0;
  document.getElementById(`meter-${name}-fill`).style.width = `${pct}%`;
}

// --- Rendering --------------------------------------------------------

function render() {
  content.innerHTML = '';
  if (!_rows.length) {
    content.innerHTML = '<div class="empty-state">No printings match this view.</div>';
    return;
  }

  // Sections are rendered in binder order whatever the sort is; the sort
  // orders the tiles inside each one, and the server has already applied it.
  for (const section of SECTION_ORDER) {
    const rows = _rows.filter(r => r.section === section);
    if (!rows.length) continue;

    const el = document.createElement('div');
    el.className = 'section';
    el.dataset.section = section;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<h2>${SECTION_TITLES[section]}</h2>`
      + `<span class="meta">${rows.length} printing${rows.length === 1 ? '' : 's'}</span>`;
    el.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (const card of rows) grid.appendChild(buildTile(card));
    el.appendChild(grid);

    content.appendChild(el);
  }
}

function buildTile(card) {
  const wrap = document.createElement('div');
  wrap.innerHTML = buildCardTile(card, {
    showQty: true,
    showBadges: true,
    showPips: true,
    packSetCode: SET_CODE,
    priceSources: _settings.price_sources,
    attrs: `data-printing-id="${esc(card.printing_id)}"`,
  });
  const el = wrap.firstElementChild;
  el._card = card;
  return el;
}

/* Repaint one card's tile in place after its counts changed, so a step costs no
   refetch. Looked up by printing_id rather than taken as an element, because a
   repaint replaces the node and the modal outlives several of them. */
function repaintCard(card) {
  const el = content.querySelector(
    `.sheet-card[data-printing-id="${CSS.escape(card.printing_id)}"]`);
  if (!el) return null;
  const fresh = buildTile(card);
  el.replaceWith(fresh);
  return fresh;
}

// --- Interaction ------------------------------------------------------

/* Two targets on one tile, deliberately separate elements: the pips are their
   own <button>s (one-click add), the art opens the modal and adds nothing.
   Click-to-add on the art was considered and rejected — it makes the largest
   target on the page destructive-ish and cannot say which finish it means. */
content.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;

  const tile = e.target.closest('.sheet-card');
  if (!tile) return;

  const pip = e.target.closest('.finish-pip');
  if (pip) { changeCopies(tile._card, pip.dataset.finish, +1); return; }

  if (e.target.closest('.sheet-card-img-wrap')) openModal(tile._card);
});

// --- The card modal ---------------------------------------------------

/* Built on shared-card-modal.js through its renderExtra hook, NOT forked. The
   other caller (deck_builder.html) passes no renderExtra, so nothing below can
   reach it.

   The copy handed to show() carries the sticky condition, so the modal's
   read-only "Condition" row agrees with the select rather than contradicting
   it. `owned` is shared by reference with the row in _rows, which is what lets
   a stepper move the count in the grid and in here at once. */
function openModal(card) {
  _modalCard = card;
  modal.show({...card, set_name: _setName, condition: _condition},
             {renderExtra: renderBinderControls});
}

/* Everything the binder adds to the modal. A DFC flip re-runs this, so it reads
   its state from _condition and from the live row rather than holding any.

   The card-detail link and the CK/TCG price links are NOT repeated here: the
   shared modal already renders "Full page →", SF and CK above this block, and a
   second copy of each would be two links to the same page. */
function renderBinderControls(card) {
  const options = CONDITIONS.map(c =>
    `<option value="${esc(c)}"${c === _condition ? ' selected' : ''}>${esc(c)}</option>`
  ).join('');

  // One row per finish the printing exists in — including the ones held in no
  // copy, because an empty pocket is the one this page exists to fill.
  const rows = card.owned.map(o => `
      <div class="binder-finish">
        <span class="label">${esc(FINISH_NAMES[o.finish] || o.finish)}</span>
        <div class="binder-stepper">
          <button type="button" class="binder-step" data-finish="${esc(o.finish)}"
                  data-delta="-1"${o.qty ? '' : ' disabled'}>&minus;</button>
          <span class="binder-count" data-finish="${esc(o.finish)}">${o.qty}</span>
          <button type="button" class="binder-step" data-finish="${esc(o.finish)}"
                  data-delta="1">+</button>
        </div>
      </div>`).join('');

  // The third treatment axis: `finishes` says a foil exists, promo_types says
  // what kind of foil it is. A badge, never a pip — you cannot own "surge".
  const kinds = parseJsonField(card.foil_kinds);
  const kindsHtml = kinds.length
    ? `<div class="modal-section"><span class="modal-section-title">Foil kind</span>`
      + `<div class="modal-tags">`
      + kinds.map(k => `<span class="badge foil-kind">${esc(foilKindLabel(k))}</span>`).join('')
      + `</div></div>`
    : '';

  return kindsHtml + `
    <div class="modal-section binder-controls">
      <span class="modal-section-title">Add to collection</span>
      <select id="binder-condition" aria-label="Condition">${options}</select>
      ${rows}
      <div class="binder-error" id="binder-error"></div>
    </div>`;
}

/* Sticky, and sticky beyond this card: the pips consume it too. */
modal.overlay.addEventListener('change', (e) => {
  if (e.target.id === 'binder-condition') _condition = e.target.value;
});

modal.overlay.addEventListener('click', (e) => {
  const btn = e.target.closest('.binder-step');
  if (!btn || !_modalCard) return;
  changeCopies(_modalCard, btn.dataset.finish, Number(btn.dataset.delta));
});

/* Repaint the open modal's counts in place. Re-rendering the whole details
   panel would work too and would also throw away the select's focus and any
   flip state, for no gain. */
function syncModal(card) {
  if (_modalCard !== card) return;
  // Closing is the shared modal's business — it has three ways to do it and
  // tells nobody. Identity plus this is enough: a step on some other card is
  // filtered above, and a step on this one while it is hidden writes counts
  // that reopening would have rendered anyway.
  if (!modal.overlay.classList.contains('active')) return;
  for (const o of card.owned) {
    const count = modal.overlay.querySelector(`.binder-count[data-finish="${CSS.escape(o.finish)}"]`);
    if (!count) continue;
    count.textContent = o.qty;
    count.previousElementSibling.disabled = o.qty === 0;
  }
}

function modalError(message) {
  const el = document.getElementById('binder-error');
  if (el) el.textContent = message;
}

/* The session batch — every add of this page visit, filed under one batch so a
   whole binder pass is reviewable at /batches/:id afterwards. That review is
   what makes an optimistic add safe: if client and server ever drift, the pass
   is auditable rather than an untracked run of writes.

   It is LAZY, and the laziness is server-side. The uuid is minted on the first
   add; the row is created by the request that first carries it and joined by
   every later one (the uuid is the batch's identity — `batch_uuid` is UNIQUE).
   So browsing, filtering and paging create no batch, because they post
   nothing, and a rapid run of clicks cannot race two batches into existence
   the way a create-then-add pair would. One pip click stays one request. */
let _batchUuid = null;
let _batchId = null;

function sessionBatch() {
  if (!_batchUuid) _batchUuid = crypto.randomUUID();
  return {
    batch_uuid: _batchUuid,
    batch_type: 'binder_click',
    name: `${_setName || SET_CODE.toUpperCase()} binder`,
    set_code: SET_CODE,
  };
}

/* The batch is only reachable once it exists, so the link appears with the
   first add that lands rather than sitting dead on page load. */
function showBatchLink(batchId) {
  if (batchId == null || _batchId === batchId) return;
  _batchId = batchId;
  const link = document.getElementById('batch-link');
  link.href = `/batches/${batchId}`;
  link.hidden = false;
}

/* One step of one finish: +1 from a pip click or the modal's +, -1 from the
   modal's -. Optimistic, because a binder pass is a run of these and waiting on
   each one is what makes the existing four-click flow unusable for it. A
   failure rolls the step back and says so where it was clicked. */
async function changeCopies(card, finish, delta) {
  const entry = card.owned.find(o => o.finish === finish);
  if (!entry) return;
  if (delta < 0 && entry.qty === 0) return;

  modalError('');
  applyDelta(card, entry, delta);
  let tile = repaintCard(card);
  syncModal(card);

  const result = delta > 0 ? await postAdd(card, finish) : await postRemove(card, finish);
  if (result.ok) {
    if (result.batch_id != null) showBatchLink(result.batch_id);
    return;
  }

  applyDelta(card, entry, -delta);
  tile = repaintCard(card);
  syncModal(card);

  if (_modalCard === card && modal.overlay.classList.contains('active')) {
    modalError(result.message);
  }
  if (tile) {
    const note = document.createElement('div');
    note.className = 'pip-error';
    note.textContent = result.message;
    tile.appendChild(note);
  }
}

/* Move the local counts by one step. The meters move only when a pocket
   crosses between empty and filled — they count printings, never copies, so a
   second copy of a card you already had fills nothing new. */
function applyDelta(card, entry, delta) {
  const wasEmpty = card.qty === 0;
  entry.qty += delta;
  card.qty += delta;
  if (wasEmpty !== (card.qty === 0)) bumpCompletion(card, wasEmpty ? +1 : -1);
}

async function postAdd(card, finish) {
  try {
    const res = await fetch('/api/collection', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        printing_id: card.printing_id,
        finish,
        condition: _condition,
        source: 'binder',
        batch: sessionBatch(),
      }),
    });
    const body = await res.json();
    if (!res.ok) return {ok: false, message: body.error || `HTTP ${res.status}`};
    return {ok: true, batch_id: body.batch_id};
  } catch (err) {
    return {ok: false, message: 'Network error'};
  }
}

/* The minus step. There is no "remove one copy of this printing" endpoint and
   there should not be one: a copy is a row with its own condition, price,
   order and history, so the copy to remove has to be named. Name the most
   recently acquired one of that finish — /api/collection/copies orders by
   acquired_at DESC — which is the copy the plus step just added, so a mis-step
   undoes itself. */
async function postRemove(card, finish) {
  const p = new URLSearchParams({printing_id: card.printing_id, finish, status: 'owned'});
  try {
    const res = await fetch(`/api/collection/copies?${p}`);
    const copies = await res.json();
    if (!res.ok) return {ok: false, message: copies.error || `HTTP ${res.status}`};
    if (!copies.length) return {ok: false, message: 'No copy to remove'};

    const del = await fetch(`/api/collection/${copies[0].id}?confirm=true`, {method: 'DELETE'});
    const body = await del.json();
    if (!del.ok) return {ok: false, message: body.error || `HTTP ${del.status}`};
    return {ok: true};
  } catch (err) {
    return {ok: false, message: 'Network error'};
  }
}

/* A pocket that just went from empty to filled (or back) moves the meters by
   one. They still count printings, never copies: a second copy of a card you
   already had fills nothing new. */
function bumpCompletion(card, delta) {
  if (_completion.owned_all != null) _completion.owned_all += delta;
  if (card.section === 'base' && _completion.owned_base != null) {
    _completion.owned_base += delta;
  }
  renderMeters();
}

// --- Init -------------------------------------------------------------

syncControls();
writeUrl();

fetch('/api/settings')
  .then(r => r.json())
  .then(s => { _settings = s; })
  .then(load);
</script>

</body>
</html>
