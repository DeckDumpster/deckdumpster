<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck group</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
header { background: #16213e; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid #0f3460; }
header h1 { font-size: 1.3rem; color: #e94560; white-space: nowrap; }
header h1 a { color: inherit; text-decoration: none; }
header h1 a:hover { text-decoration: underline; }
main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
input[type="text"], textarea, button { padding: 8px 14px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #e0e0e0; font-size: 0.9rem; font-family: inherit; }
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; background: #0f3460; }
button:hover { background: #e94560; border-color: #e94560; }
button.danger { background: #c0392b; border-color: #c0392b; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.totals { color: #aaa; display: flex; gap: 16px; flex-wrap: wrap; }
.desc { margin-top: 8px; color: #bbb; }
.deck-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
.deck-row { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 12px 14px; }
.deck-row a { color: #e94560; font-weight: 600; text-decoration: none; }
.deck-row .meta { color: #888; font-size: 0.85rem; margin-top: 4px; }
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 16px; }
.modal-backdrop.active { display: flex; }
.modal { background: #16213e; border: 1px solid #0f3460; border-radius: 10px; padding: 20px; width: 100%; max-width: 460px; }
.modal h3 { margin-bottom: 12px; }
.modal label.opt { display: block; margin: 10px 0; }
.modal .buttons { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.error { color: #ff7675; margin-top: 8px; }
@media (max-width: 600px) { header, main { padding-left: 12px; padding-right: 12px; } .actions button { flex: 1 1 auto; } }
</style>
</head>
<body>
<header>
  <h1><a href="/">MTG</a> / <a href="/decks">Decks</a> / <span id="title">Group</span></h1>
</header>
<main>
  <div class="totals" id="totals"></div>
  <div class="desc" id="desc"></div>
  <div class="actions">
    <button id="rename-btn">Rename</button>
    <button id="release-btn">Release all decks</button>
    <button id="delete-btn" class="danger">Delete group</button>
  </div>
  <div class="error" id="error"></div>
  <div class="deck-rows" id="decks"></div>
</main>

<div class="modal-backdrop" id="rename-modal">
  <div class="modal">
    <h3>Rename group</h3>
    <input type="text" id="rename-name" style="width:100%">
    <textarea id="rename-desc" rows="2" placeholder="Description" style="margin-top:8px"></textarea>
    <div class="buttons"><button id="rename-save">Save</button><button data-close>Cancel</button></div>
  </div>
</div>

<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <h3>Delete group</h3>
    <label class="opt"><input type="radio" name="del-mode" value="ungroup" checked> Keep the decks, remove them from the group</label>
    <label class="opt"><input type="radio" name="del-mode" value="delete_decks"> Delete the decks too (their cards return to the collection)</label>
    <div class="buttons"><button id="delete-confirm" class="danger">Delete</button><button data-close>Cancel</button></div>
  </div>
</div>

<script>
function formatPrice(value) {
  const n = parseFloat(value);
  if (!Number.isFinite(n)) return '$0.00';
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
const groupId = location.pathname.split('/').filter(Boolean)[1];
let group = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function show(g) {
  group = g;
  document.title = g.name + ' · Deck group';
  document.getElementById('title').textContent = g.name;
  document.getElementById('totals').innerHTML =
    `<span>${g.decks.length} decks</span><span>${g.card_count} cards</span>` +
    (g.total_value ? `<span>${formatPrice(g.total_value)}</span>` : '');
  document.getElementById('desc').textContent = g.description || '';
  document.getElementById('decks').innerHTML = g.decks.map(d => `
    <div class="deck-row">
      <a href="/decks/${d.id}">${esc(d.name)}</a>
      <div class="meta">${esc(d.state)}${d.format ? ' · ' + esc(d.format) : ''} · ${d.card_count} cards</div>
    </div>`).join('') || '<div class="meta">No decks in this group.</div>';
}

async function run(fn) {
  document.getElementById('error').textContent = '';
  try { await fn(); } catch (e) { document.getElementById('error').textContent = e.message; }
}

document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => b.closest('.modal-backdrop').classList.remove('active')));

document.getElementById('rename-btn').addEventListener('click', () => {
  document.getElementById('rename-name').value = group.name;
  document.getElementById('rename-desc').value = group.description || '';
  document.getElementById('rename-modal').classList.add('active');
});
document.getElementById('rename-save').addEventListener('click', () => run(async () => {
  await api('PUT', '/api/deck-groups/' + groupId, {
    name: document.getElementById('rename-name').value,
    description: document.getElementById('rename-desc').value.trim() || null,
  });
  document.getElementById('rename-modal').classList.remove('active');
  await load();
}));
document.getElementById('release-btn').addEventListener('click', () => run(async () => {
  if (!confirm(`Release every deck in "${group.name}"? Their cards go back to the collection.`)) return;
  await api('POST', '/api/deck-groups/' + groupId + '/release', {});
  await load();
}));
document.getElementById('delete-btn').addEventListener('click', () =>
  document.getElementById('delete-modal').classList.add('active'));
document.getElementById('delete-confirm').addEventListener('click', () => run(async () => {
  const mode = document.querySelector('input[name="del-mode"]:checked').value;
  await api('DELETE', '/api/deck-groups/' + groupId + '?decks=' + mode);
  location.href = '/decks';
}));

async function load() { show(await api('GET', '/api/deck-groups/' + groupId)); }
run(load);
</script>
</body>
</html>
