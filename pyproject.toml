[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-collector"
version = "2.0.0"
description = "CLI tool for managing Magic: The Gathering card collections"
readme = "README.md"
# The floor, not the version anything actually runs on. `.python-version` pins
# that to 3.12, matching the Containerfile's python:3.12-slim, so the venv the
# tests run in and the image they test against agree.
#
# Without the pin uv picks the newest interpreter on the box. On a machine whose
# system python is 3.14 that resolves to a set onnxruntime has no wheel for:
#
#   error: Distribution `onnxruntime==1.23.0` can't be installed because it
#   doesn't have a source distribution or wheel for the current platform
#   hint: You're using CPython 3.14 (`cp314`), but `onnxruntime` (v1.23.0) only
#   has wheels with the following Python ABI tags: cp310, cp311, cp312, cp313
#
# The container build never saw this because its interpreter is pinned in the
# Containerfile; only the host venv drifted, and only on a machine new enough to
# ship 3.14 (de-323).
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ryan Gantt"}
]
keywords = ["mtg", "magic", "cards", "collection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "anthropic>=0.18.0",
    "beautifulsoup4>=4.12.0",
    "lark>=1.1",
    "numpy<2",
    "onnxruntime>=1.18.0,<=1.23.0",
    "rapidocr>=3.3,<4",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mtg = "mtg_collector.cli:main"

[project.urls]
Repository = "https://github.com/ryangantt/efj-mtgc"

[tool.setuptools.package-data]
mtg_collector = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mtg_collector*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--ignore=tests/ui/ --tb=short -q"
markers = [
    "scryfall: tests requiring Scryfall API access (use --scryfall to enable)",
    "generative: seed-based generative tests with reverse parser",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pytest>=7.0.0",
    "shot-scraper>=1.9.1",
    "pyyaml>=6.0",
]
